name: Deploy xFlix Zone Movies to Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy to Hetzner VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER || 'root' }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:/root/.nvm/versions/node/$(ls /root/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            export PATH=$PATH:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            echo "=================================================="
            echo "🚀 AUTO-DEPLOYING NEXTZONE MOVIES ON HETZNER"
            echo "=================================================="
            
            # Find or initialize the actual directory where xflix / nextzone is located
            TARGET_DIR=""
            for dir in "/var/www/nextzone-movies" "/var/www/xflix-zone-movies" "/var/www/xflix-zone" "/var/www/xflix" "/var/www/xflix.ink" "/var/www/movies.xflix.ink"; do
              if [ -d "$dir/.git" ]; then
                TARGET_DIR="$dir"
                echo "Found active git directory: $TARGET_DIR"
                break
              fi
            done

            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="/var/www/nextzone-movies"
              mkdir -p "$TARGET_DIR"
              git clone https://github.com/skyyexin-alt/xflix-zone-movies.git "$TARGET_DIR" || true
            fi

            cd "$TARGET_DIR"
            echo "Deploying in: $TARGET_DIR"

            git config --global --add safe.directory "$TARGET_DIR" || true
            git remote set-url origin https://github.com/skyyexin-alt/xflix-zone-movies.git || true
            git fetch origin main || git fetch --all
            git reset --hard origin/main

            echo "NEXT_PUBLIC_TMDB_API_KEY=5d067b9d81cc3970f1365e1e9862ce6b" > .env.local
            echo "NEXT_PUBLIC_SITE_URL=https://xflix.ink" >> .env.local

            # Ensure pm2 is available
            which pm2 || npm install -g pm2 || true

            rm -rf .next public/sw.js public/workbox-*.js
            npm install
            npm run build

            # Inspect active Nginx proxy ports
            echo "--- Active Nginx Upstreams ---"
            grep -rn "proxy_pass" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ || true

            # Stop all old processes (xflix, nextzone-movies, etc.) to free port 3000
            pm2 delete all || true
            fuser -k 3000/tcp || true

            # Start production server using ecosystem.config.js with fallback
            pm2 start ecosystem.config.js || pm2 start "npx next start -p 3000" --name "nextzone-movies"
            pm2 save --force || true

            # Clear nginx cache and restart
            rm -rf /var/cache/nginx/* || true
            systemctl reload nginx || systemctl restart nginx || true

            echo "Verifying server on port 3000..."
            sleep 4
            curl -sI http://127.0.0.1:3000 | head -n 8 || true
            pm2 status
            pm2 logs nextzone-movies --lines 15 --nostream || true

            echo "=================================================="
            echo "🎉 DEPLOYMENT SUCCESSFUL!"
            echo "=================================================="
