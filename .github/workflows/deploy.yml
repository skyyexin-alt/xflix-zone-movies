name: Deploy xFlix Zone Movies to Hetzner

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Checkout Codebase
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛠️ Build Production Bundle
        run: npm run build

      - name: 🚀 Deploy to Hetzner VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST || secrets.SERVER_IP }}
          username: ${{ secrets.HETZNER_USER || 'root' }}
          password: ${{ secrets.HETZNER_PASSWORD || secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:/root/.nvm/versions/node/$(ls /root/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            export PATH=$PATH:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            echo "=================================================="
            echo "🚀 STARTING HETZNER AUTO-DEPLOYMENT FOR NEXTZONE"
            echo "=================================================="

            TARGET_DIR="/var/www/xflix-movies"
            if [ ! -d "$TARGET_DIR" ]; then
              FOUND_DIR=$(find /var/www /root /home /opt -name "xflix-movies" -o -name "nextzone" -o -name "xflix" 2>/dev/null | head -n 1)
              if [ -n "$FOUND_DIR" ]; then
                TARGET_DIR="$FOUND_DIR"
              fi
            fi

            echo "--> Deploying to target directory: $TARGET_DIR"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            git config --global --add safe.directory "$TARGET_DIR" || true
            git checkout -f main || true
            git fetch --all
            git reset --hard origin/main || git pull origin main --force

            echo "--> Installing dependencies & building app..."
            npm install --legacy-peer-deps || npm install
            rm -rf .next
            npm run build

            # Detect proxy port from Nginx configuration for movies.xflix.ink
            DETECTED_PORT=$(grep -rh "proxy_pass" /etc/nginx/ 2>/dev/null | grep -oE "127\.0\.0\.1:[0-9]+|localhost:[0-9]+" | head -n 1 | cut -d':' -f2)
            PORT_TO_USE="${DETECTED_PORT:-3001}"
            echo "--> Detected Nginx target port: $PORT_TO_USE"

            echo "--> Restarting PM2 process on port $PORT_TO_USE..."
            pm2 delete xflix-movies || true
            pm2 delete nextzone || true
            pm2 delete all || true

            PORT=$PORT_TO_USE pm2 start node_modules/next/dist/bin/next --name "xflix-movies" -- start -p $PORT_TO_USE || PORT=$PORT_TO_USE pm2 start npm --name "xflix-movies" -- start -- -p $PORT_TO_USE
            pm2 save --force || true

            echo "--> Reloading Nginx web server..."
            systemctl reload nginx || systemctl restart nginx || true
            echo "=================================================="
            echo "🎉 DEPLOYMENT COMPLETE! https://movies.xflix.ink is live on port $PORT_TO_USE."
            echo "=================================================="
